<!DOCTYPE html>
<html>
<head>
    <title>G-Force Gus - Extreme</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; }
        .ui-panel { position: absolute; top: -110px; width: 100%; text-align: center; }
        .meter-container { width: 300px; height: 15px; background: #333; border: 2px solid #555; margin: 10px auto; border-radius: 10px; overflow: hidden; }
        #nausea-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #2ecc71, #ff6b6b); transition: width 0.1s; }
        .score-box { display: flex; justify-content: space-around; width: 400px; margin: 0 auto; }
        .stat { font-size: 1.2rem; font-weight: bold; }
        #high-score { color: #f1c40f; }
        #current-rpm { color: #00ff00; }
        canvas { background: radial-gradient(#444, #222); border-radius: 50%; border: 8px solid #333; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-panel">
            <div class="score-box">
                <div class="stat">RPM: <span id="current-rpm">0</span></div>
                <div class="stat">BEST: <span id="high-score">0</span></div>
            </div>
            <div class="meter-container">
                <div id="nausea-bar"></div>
            </div>
        </div>
        <canvas id="gameCanvas" width="450" height="450"></canvas>
    </div>

    <p style="margin-top:20px; color:#777;">MASH <kbd>A</kbd> and <kbd>D</kbd> | DON'T LET HIM BLOW!</p>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const rpmEl = document.getElementById("current-rpm");
    const hsEl = document.getElementById("high-score");
    const nauseaBar = document.getElementById("nausea-bar");

    // Load Textures
    const gusNormal = new Image();
    gusNormal.src = 'gus.png';
    
    const gusSick = new Image();
    gusSick.src = 'throwupgus.png';

    let rotation = 0;
    let speed = 0;
    let nausea = 0;
    let lastKey = "";
    let gameActive = true;
    
    let highScore = localStorage.getItem("gusHighScore") || 0;
    hsEl.innerText = highScore;

    window.addEventListener("keydown", (e) => {
        if (!gameActive) return;
        // Mashing build-up
        if ((e.code === "KeyA" && lastKey !== "KeyA") || (e.code === "KeyD" && lastKey !== "KeyD")) {
            speed += 0.8; // Increased boost per click
            lastKey = e.code;
        }
    });

    function drawGus(angle) {
        ctx.save();
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(angle);

        // Draw spinning bar
        ctx.strokeStyle = "#444";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(-180, 0);
        ctx.lineTo(180, 0);
        ctx.stroke();

        // Texture Swap Logic
        const gusSize = 100;
        let currentTexture = (nausea > 75) ? gusSick : gusNormal;

        // Draw the active texture
        try {
            ctx.drawImage(currentTexture, 120 - gusSize/2, -gusSize/2, gusSize, gusSize);
        } catch(e) {
            // Fallback if images aren't found
            ctx.fillStyle = (nausea > 75) ? "green" : "flesh";
            ctx.fillRect(100, -20, 40, 40);
        }

        ctx.restore();
    }

    function update() {
        if (!gameActive) return;

        speed *= 0.985; // Friction (air resistance)
        rotation += speed * 0.1;

        // Nausea calculation
        if (speed > 3) {
            nausea += (speed * 0.05); 
        } else {
            nausea -= 0.6; // Recovery speed
        }

        nausea = Math.min(Math.max(0, nausea), 100);
        nauseaBar.style.width = nausea + "%";
        
        // RPM Calculation (speed * factor)
        // We'll use 15 as a factor to make the numbers look like real RPMs
        let currentRPM = Math.floor(speed * 15); 
        rpmEl.innerText = currentRPM;

        if (currentRPM > highScore) {
            highScore = currentRPM;
            localStorage.setItem("gusHighScore", highScore);
            hsEl.innerText = highScore;
        }

        if (nausea >= 100) {
            gameActive = false;
            setTimeout(() => {
                alert("BLEUGH! Total Disaster. Max RPM: " + currentRPM);
                location.reload();
            }, 100);
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        update();
        drawGus(rotation);
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
