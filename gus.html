<!DOCTYPE html>
<html>
<head>
    <title>G-Force Gus - High Score</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; }
        .ui-panel { position: absolute; top: -110px; width: 100%; text-align: center; }
        .meter-container { width: 300px; height: 15px; background: #333; border: 2px solid #555; margin: 10px auto; border-radius: 10px; overflow: hidden; }
        #nausea-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #2ecc71, #ff6b6b); transition: width 0.1s; }
        .score-box { display: flex; justify-content: space-around; width: 400px; margin: 0 auto; }
        .stat { font-size: 1.2rem; font-weight: bold; }
        #high-score { color: #f1c40f; }
        #current-rpm { color: #00ff00; }
        canvas { background: radial-gradient(#444, #222); border-radius: 50%; border: 8px solid #333; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-panel">
            <div class="score-box">
                <div class="stat">RPM: <span id="current-rpm">0</span></div>
                <div class="stat">BEST: <span id="high-score">0</span></div>
            </div>
            <div class="meter-container">
                <div id="nausea-bar"></div>
            </div>
        </div>
        <canvas id="gameCanvas" width="450" height="450"></canvas>
    </div>

    <p style="margin-top:20px; color:#777;">MASH <kbd>A</kbd> and <kbd>D</kbd> TO SPIN</p>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const rpmEl = document.getElementById("current-rpm");
    const hsEl = document.getElementById("high-score");
    const nauseaBar = document.getElementById("nausea-bar");

    // Load Texture
    const gusImg = new Image();
    gusImg.src = 'gus.png'; 
    // Fallback if image doesn't exist
    let imgLoaded = false;
    gusImg.onload = () => imgLoaded = true;

    let rotation = 0;
    let speed = 0;
    let nausea = 0;
    let lastKey = "";
    let gameActive = true;
    
    // Initialize High Score
    let highScore = localStorage.getItem("gusHighScore") || 0;
    hsEl.innerText = highScore;

    window.addEventListener("keydown", (e) => {
        if (!gameActive) return;
        if ((e.code === "KeyA" && lastKey !== "KeyA") || (e.code === "KeyD" && lastKey !== "KeyD")) {
            speed += 0.6;
            lastKey = e.code;
        }
    });

    function drawGus(angle) {
        ctx.save();
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(angle);

        // Draw the spinning arm
        ctx.strokeStyle = "#555";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(-180, 0);
        ctx.lineTo(180, 0);
        ctx.stroke();

        // Draw Gus (The Texture)
        const gusSize = 80;
        if (imgLoaded) {
            // Draws the image centered at the end of the arm
            ctx.drawImage(gusImg, 120 - gusSize/2, -gusSize/2, gusSize, gusSize);
        } else {
            // Placeholder if gus.png is missing
            ctx.fillStyle = nausea > 75 ? "#82ccdd" : "#ffdbac";
            ctx.fillRect(120 - 20, -20, 40, 40);
            ctx.fillStyle = "black";
            ctx.fillText("MISSING PNG", 100, 40);
        }

        ctx.restore();
    }

    function update() {
        if (!gameActive) return;

        speed *= 0.985; // Friction
        rotation += speed * 0.1;

        // Nausea builds faster as speed increases
        if (speed > 4) {
            nausea += (speed * 0.06);
        } else {
            nausea -= 0.4;
        }

        nausea = Math.min(Math.max(0, nausea), 100);
        nauseaBar.style.width = nausea + "%";
        
        let currentRPM = Math.floor(speed * 10);
        rpmEl.innerText = currentRPM;

        // Update High Score Live
        if (currentRPM > highScore) {
            highScore = currentRPM;
            localStorage.setItem("gusHighScore", highScore);
            hsEl.innerText = highScore;
        }

        if (nausea >= 100) {
            gameActive = false;
            setTimeout(() => {
                alert("GAME OVER! Gus painted the town green. Max RPM: " + currentRPM);
                location.reload();
            }, 100);
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        update();
        drawGus(rotation);
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
