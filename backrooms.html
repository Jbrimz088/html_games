<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Stamina Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        
        /* VHS Overlay */
        #vhs-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 10;
        }

        #ui { position: absolute; bottom: 30px; left: 30px; color: #f1c40f; z-index: 11; }
        
        /* Stamina Bar UI */
        #stamina-container {
            position: absolute; bottom: 30px; right: 30px; width: 200px; height: 10px;
            border: 2px solid #ceb35b; background: rgba(0,0,0,0.5); z-index: 11;
        }
        #stamina-bar { width: 100%; height: 100%; background: #f1c40f; transition: background 0.3s; }
        .exhausted { background: #ff3300 !important; }

        #status { font-size: 1.2em; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

<div id="vhs-overlay"></div>
<div id="ui"><div id="status">REC ● 00:02:41</div></div>

<div id="stamina-container">
    <div id="stamina-bar"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';
import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.132.2/examples/jsm/controls/PointerLockControls.js';

// --- INITIALIZATION ---
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a1a0a, 2, 22);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, document.body);
document.addEventListener('click', () => controls.lock());

// --- STAMINA & MOVEMENT VARIABLES ---
let stamina = 100;
let isExhausted = false;
let moveSpeed = 0.07;
const sprintMultiplier = 1.8;
const staminaDepletion = 0.5;
const staminaRecovery = 0.3;

// --- TEXTURES ---
const loader = new THREE.TextureLoader();
const wallTex = loader.load('https://www.transparenttextures.com/patterns/paper-fibers.png');
const floorTex = loader.load('https://www.transparenttextures.com/patterns/concrete-wall.png');

// --- WORLD ASSETS ---
const wallMat = new THREE.MeshStandardMaterial({ color: 0xceb35b, map: wallTex });
const walls = [];
for(let i=0; i<400; i++) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), wallMat);
    wall.position.set(Math.round((Math.random()-0.5)*80/2)*2, 2, Math.round((Math.random()-0.5)*80/2)*2);
    if(Math.abs(wall.position.x) > 3 || Math.abs(wall.position.z) > 3) {
        scene.add(wall);
        walls.push(wall);
    }
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x8a7d4a, map: floorTex }));
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const ceil = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
ceil.position.y = 4; ceil.rotation.x = Math.PI/2;
scene.add(ceil);

// Hand & Flashlight
const hand = new THREE.Group();
const flashlight = new THREE.SpotLight(0xffffff, 2, 20, 0.45, 0.4);
hand.add(flashlight); hand.add(flashlight.target);
flashlight.target.position.set(0,0,-1);
camera.add(hand);
scene.add(camera);
scene.add(new THREE.AmbientLight(0xfff5cc, 0.15));

// Monster
const monster = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 0.4), new THREE.MeshBasicMaterial({ color: 0x000000 }));
monster.position.set(20, 1.6, 20);
scene.add(monster);

// --- INPUT & LOGIC ---
let keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);

function updateStamina() {
    const bar = document.getElementById('stamina-bar');
    const isSprinting = keys['ShiftLeft'] && (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']);

    if (isSprinting && stamina > 0 && !isExhausted) {
        stamina -= staminaDepletion;
        moveSpeed = 0.13;
        if (stamina <= 0) {
            isExhausted = true;
            bar.classList.add('exhausted');
        }
    } else {
        moveSpeed = 0.07;
        if (stamina < 100) stamina += staminaRecovery;
        if (stamina >= 30) { // Recovery threshold
            isExhausted = false;
            bar.classList.remove('exhausted');
        }
    }
    bar.style.width = stamina + '%';
}

function checkCollision(pos) {
    const pBox = new THREE.Box3().setFromCenterAndSize(pos, new THREE.Vector3(0.7, 1, 0.7));
    for(let w of walls) {
        if (pBox.intersectsBox(new THREE.Box3().setFromObject(w))) return true;
    }
    return false;
}

let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.05;

    if (controls.isLocked) {
        updateStamina();
        const prev = camera.position.clone();

        // Walking Headbob
        const bob = isExhausted ? 0.02 : 0.01;
        camera.position.y = 1.7 + Math.sin(time * (moveSpeed * 100)) * bob;

        if (keys['KeyW']) controls.moveForward(moveSpeed);
        if (keys['KeyS']) controls.moveForward(-moveSpeed);
        if (keys['KeyA']) controls.moveRight(-moveSpeed);
        if (keys['KeyD']) controls.moveRight(moveSpeed);

        if (checkCollision(camera.position)) camera.position.copy(prev);

        // Monster Stalking
        const dist = camera.position.distanceTo(monster.position);
        if (dist < 15) {
            monster.lookAt(camera.position.x, 1.6, camera.position.z);
            // Matches player's dynamic speed
            monster.translateZ(moveSpeed * 0.97);
        }

        if (dist < 0.8) { alert("RUNNING WON'T SAVE YOU."); location.reload(); }
    }
    renderer.render(scene, camera);
}

camera.position.y = 1.7;
animate();
</script>
</body>
</html>
